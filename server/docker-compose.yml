# Gamespeaker server: LiveKit (voice/video) + gateway (login, presence, chat) + Caddy (HTTPS).
# Everything uses host networking: LiveKit needs direct UDP access and this keeps
# Caddy -> 127.0.0.1 proxying simple. Only Caddy (80/443) and LiveKit media
# (7881/tcp, 7882/udp) are reachable from outside; the firewall blocks the rest.

name: gamespeaker

services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --config /etc/livekit.yaml
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  gateway:
    build: ./gateway
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      DATA_DIR: /data
      LIVEKIT_URL: wss://${DOMAIN}
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.7-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - livekit
      - gateway

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
