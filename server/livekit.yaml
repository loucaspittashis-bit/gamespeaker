# LiveKit SFU config. API keys come from the LIVEKIT_KEYS environment variable
# (set in docker-compose.yml from .env), so no secrets live in this file.

port: 7880

rtc:
  # TCP fallback for networks that block UDP.
  tcp_port: 7881
  # All UDP media on one port instead of a 10,000-port range.
  udp_port: 7882
  # Discover the server's public IP and advertise it to clients.
  use_external_ip: true

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 25
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    - mime: video/h264
    - mime: video/vp9
    - mime: video/av1

# Speaking detection: report changes faster than the default so speaking
# rings feel instant.
audio:
  update_interval: 200
  smooth_intervals: 2

logging:
  level: info
